 rx="16" fill="#e0efff" stroke="#70a7ec" stroke-width="2"/><text x="681" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#14233d">PRIVATE APP A — 10.20.11.0/24</text><text x="681" y="501" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#14233d">EC2 / ECS service targets</text><text x="681" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#14233d">Target group: HTTPS : 8443</text><text x="1119" y="470" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#14233d">PRIVATE APP B — 10.20.12.0/24</text><text x="1119" y="501" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#14233d">EC2 / ECS service targets</text><text x="1119" y="532" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#14233d">Target group: HTTPS : 8443</text><rect x="835" y="603" width="486" height="61" rx="15" fill="#dbeafe" stroke="#478bd0" stroke-width="2"/><text x="1078" y="642" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#144374">ALB: HTTPS listener 443  •  path/host rules</text><path d="M266 280 L319 280" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><path d="M564 280 L618 280" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><path d="M830 404 L830 430" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><path d="M1285 404 L1285 430" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><text x="800" y="743" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102f58">ALB: Layer 7 HTTP/HTTPS  |  NLB: Layer 4 TCP/UDP/TLS/QUIC (where supported)</text><rect x="22" y="772" width="750" height="183" rx="16" fill="#fff" stroke="#c8d9ef" stroke-width="2"/><rect x="789" y="772" width="789" height="183" rx="16" fill="#fff" stroke="#c8d9ef" stroke-width="2"/><text x="47" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#074d91">Application Load Balancer (ALB)</text><text x="47" y="847" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">• Host/path/header/query routing; TLS termination</text><text x="47" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">• Target groups: instance, IP, Lambda</text><text x="47" y="903" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">• HTTP health checks, WAF integration</text><text x="813" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#074d91">Network Load Balancer (NLB)</text><text x="813" y="847" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">• Layer 4 transport traffic; high throughput</text><text x="813" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">• Static IPs per AZ; optional Elastic IPs</text><text x="813" y="903" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">• Target groups: instances, IPs, ALB</text></svg>