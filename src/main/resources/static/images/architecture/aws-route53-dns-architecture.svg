<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#1877d2"/></marker><linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d3264"/><stop offset="1" stop-color="#0862b6"/></linearGradient></defs><rect width="1600" height="980" fill="#f6f9ff"/><rect x="20" y="15" width="1560" height="116" rx="20" fill="url(#header)" stroke="#0c4580" stroke-width="0"/><text x="800" y="68" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#fff">Amazon Route 53 — DNS &amp; Traffic Routing</text><text x="800" y="105" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#dcefff">Hosted zones, alias records, health checks, multi-region failover and routing policies</text><rect x="22" y="153" width="1556" height="545" rx="18" fill="#fff" stroke="#c8d9ef" stroke-width="2"/><rect x="43" y="181" width="250" height="177" rx="16" fill="#eef5ff" stroke="#80afe1" stroke-width="2"/><text x="65" y="228" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#14233d">INTERNET CLIENT</text><text x="65" y="259" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#14233d">app.example.com</text><text x="65" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#14233d">DNS resolver query</text><rect x="348" y="181" width="390" height="177" rx="16" fill="#f4eaff" stroke="#a990e6" stroke-width="2"/><text x="372" y="220" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#14233d">AMAZON ROUTE 53</text><text x="372" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#14233d">Public hosted zone: example.com</text><text x="372" y="282" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#14233d">Alias A/AAAA → ALB / CloudFront</text><text x="372" y="313" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#14233d">Health-aware failover policies</text><rect x="799" y="181" width="752" height="444" rx="16" fill="#f0faf5" stroke="#61aa86" stroke-width="2"/><text x="830" y="221" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#08633f">APPLICATION DESTINATIONS</text><rect x="832" y="251" width="330" height="127" rx="16" fill="#e1eeff" stroke="#81b2ea" stroke-width="2"/><text x="854" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#14233d">PRIMARY: us-east-1</text><text x="854" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#14233d">ALB → service → database</text><text x="854" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#14233d">Health checks: healthy</text><rect x="1194" y="251" width="320" height="127" rx="16" fill="#e1eeff" stroke="#81b2ea" stroke-width="2"/><text x="1216" y="291" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#14233d">SECONDARY: us-west-2</text><text x="1216" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#14233d">ALB → standby deployment</text><text x="1216" y="353" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#14233d">Health checks: healthy</text><rect x="832" y="422" width="682" height="155" rx="16" fill="#fff" stroke="#83bda2" stroke-width="2"/><text x="856" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#14233d">OTHER ROUTE 53 TARGETS</text><text x="856" y="489" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#14233d">CloudFront distribution • API Gateway domain</text><text x="856" y="520" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#14233d">S3 static website endpoint • regional ALB / NLB</text><path d="M293 278 L348 278" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><path d="M738 278 L799 278" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><path d="M1049 378 L1049 422" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><path d="M1343 378 L1343 422" fill="none" stroke="#1877d2" stroke-width="5"  marker-end="url(#arr)"/><text x="820" y="653" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#0f4a77">DNS chooses an endpoint; it does not proxy HTTP traffic.</text><rect x="22" y="723" width="751" height="231" rx="16" fill="#fff" stroke="#c8d9ef" stroke-width="2"/><rect x="789" y="723" width="789" height="231" rx="16" fill="#fff" stroke="#c8d9ef" stroke-width="2"/><text x="46" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#074d91">Routing policies</text><text x="47" y="804" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">Simple • Weighted • Latency-based • Failover</text><text x="47" y="842" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">Geolocation • Geoproximity • IP-based</text><text x="47" y="880" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">Multivalue answer (health-checked responses)</text><text x="811" y="764" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#074d91">DNS and architecture essentials</text><text x="812" y="804" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">Public vs. private hosted zones; split-horizon DNS</text><text x="812" y="842" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">Alias A/AAAA records for supported AWS endpoints</text><text x="812" y="880" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#14233d">TTL/caching, health checks, DNSSEC, query logs</text></svg>