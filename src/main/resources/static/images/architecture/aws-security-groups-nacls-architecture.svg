<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2875c4"/></marker></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f6f9fe" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1600" height="105" rx="0" fill="#0b3669" stroke="none" stroke-width="0"/><text x="46" y="49" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" fill="#ffffff" font-weight="800" text-anchor="start">AWS VPC | Security Groups &amp; Network ACLs</text><text x="46" y="79" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#d5eaff" font-weight="400" text-anchor="start">Defense in depth: stateful resource rules + stateless subnet rules</text><rect x="34" y="126" width="1078" height="705" rx="18" fill="#fff" stroke="#a9c4e3" stroke-width="2"/><text x="58" y="163" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#164677" font-weight="800" text-anchor="start">AWS REGION  •  Example VPC 10.0.0.0/16</text><rect x="56" y="184" width="1034" height="618" rx="14" fill="#f4f9ff" stroke="#8ab6e7" stroke-width="2"/><rect x="73" y="215" width="166" height="85" rx="12" fill="#e9f0fa" stroke="#adc6e4" stroke-width="2"/><text x="156" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#173e6a" font-weight="800" text-anchor="middle">INTERNET</text><text x="156" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#47627e" font-weight="400" text-anchor="middle">Clients / DNS</text><rect x="258" y="215" width="151" height="85" rx="12" fill="#eaf6ff" stroke="#96c8e3" stroke-width="2"/><text x="334" y="245" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#134e8a" font-weight="800" text-anchor="middle">AWS WAF</text><text x="334" y="270" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#47627e" font-weight="400" text-anchor="middle">Optional</text><rect x="429" y="215" width="210" height="85" rx="12" fill="#e2f1ff" stroke="#6ea1da" stroke-width="2"/><text x="534" y="243" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#154a85" font-weight="800" text-anchor="middle">Application LB</text><text x="534" y="268" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#154a85" font-weight="500" text-anchor="middle">ALB-SG • TCP 443</text><line x1="239" y1="257" x2="258" y2="257" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><line x1="409" y1="257" x2="429" y2="257" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="660" y="215" width="408" height="85" rx="12" fill="#fff6e7" stroke="#f4ce8a" stroke-width="2"/><text x="864" y="244" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#8c4f0c" font-weight="800" text-anchor="middle">PUBLIC SUBNET NACL</text><text x="864" y="271" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#8c4f0c" font-weight="500" text-anchor="middle">Subnets A/B • inbound + outbound rules</text><line x1="639" y1="257" x2="660" y2="257" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="75" y="330" width="482" height="445" rx="12" fill="#fff" stroke="#83a9d3" stroke-width="2" stroke-dasharray="9 6"/><text x="93" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#174b86" font-weight="800" text-anchor="start">Availability Zone A</text><rect x="90" y="376" width="452" height="114" rx="10" fill="#eaf6ee" stroke="#d0dded" stroke-width="2"/><text x="104" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#22854c" font-weight="800" text-anchor="start">PUBLIC</text><text x="104" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#405873" font-weight="500" text-anchor="start">10.0.1.0/24</text><rect x="369" y="389" width="155" height="29" rx="8" fill="#ffe9f0" stroke="none" stroke-width="0"/><text x="446.5" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8e2454" font-weight="700" text-anchor="middle">Public-NACL</text><rect x="90" y="500" width="452" height="114" rx="10" fill="#eaf3ff" stroke="#d0dded" stroke-width="2"/><text x="104" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1966b0" font-weight="800" text-anchor="start">PRIVATE APPLICATION</text><text x="104" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#405873" font-weight="500" text-anchor="start">10.0.3.0/24</text><rect x="369" y="513" width="155" height="29" rx="8" fill="#ffe9f0" stroke="none" stroke-width="0"/><text x="446.5" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8e2454" font-weight="700" text-anchor="middle">App-NACL</text><rect x="90" y="624" width="452" height="114" rx="10" fill="#f2eefe" stroke="#d0dded" stroke-width="2"/><text x="104" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#6843bd" font-weight="800" text-anchor="start">ISOLATED DATABASE</text><text x="104" y="675" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#405873" font-weight="500" text-anchor="start">10.0.5.0/24</text><rect x="369" y="637" width="155" height="29" rx="8" fill="#ffe9f0" stroke="none" stroke-width="0"/><text x="446.5" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8e2454" font-weight="700" text-anchor="middle">DB-NACL</text><rect x="112" y="444" width="176" height="29" rx="8" fill="#dff0ff" stroke="none" stroke-width="0"/><text x="200.0" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#134e8a" font-weight="700" text-anchor="middle">ALB ENI • ALB-SG</text><rect x="112" y="568" width="182" height="29" rx="8" fill="#dff0ff" stroke="none" stroke-width="0"/><text x="203.0" y="588" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#134e8a" font-weight="700" text-anchor="middle">EC2 ENI • App-SG</text><rect x="112" y="692" width="172" height="29" rx="8" fill="#e9e4ff" stroke="none" stroke-width="0"/><text x="198.0" y="712" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5d35a8" font-weight="700" text-anchor="middle">RDS ENI • DB-SG</text><line x1="183" y1="490" x2="183" y2="500" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><line x1="183" y1="614" x2="183" y2="624" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><rect x="577" y="330" width="482" height="445" rx="12" fill="#fff" stroke="#83a9d3" stroke-width="2" stroke-dasharray="9 6"/><text x="595" y="358" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#174b86" font-weight="800" text-anchor="start">Availability Zone B</text><rect x="592" y="376" width="452" height="114" rx="10" fill="#eaf6ee" stroke="#d0dded" stroke-width="2"/><text x="606" y="403" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#22854c" font-weight="800" text-anchor="start">PUBLIC</text><text x="606" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#405873" font-weight="500" text-anchor="start">10.0.2.0/24</text><rect x="871" y="389" width="155" height="29" rx="8" fill="#ffe9f0" stroke="none" stroke-width="0"/><text x="948.5" y="409" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8e2454" font-weight="700" text-anchor="middle">Public-NACL</text><rect x="592" y="500" width="452" height="114" rx="10" fill="#eaf3ff" stroke="#d0dded" stroke-width="2"/><text x="606" y="527" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1966b0" font-weight="800" text-anchor="start">PRIVATE APPLICATION</text><text x="606" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#405873" font-weight="500" text-anchor="start">10.0.4.0/24</text><rect x="871" y="513" width="155" height="29" rx="8" fill="#ffe9f0" stroke="none" stroke-width="0"/><text x="948.5" y="533" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8e2454" font-weight="700" text-anchor="middle">App-NACL</text><rect x="592" y="624" width="452" height="114" rx="10" fill="#f2eefe" stroke="#d0dded" stroke-width="2"/><text x="606" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#6843bd" font-weight="800" text-anchor="start">ISOLATED DATABASE</text><text x="606" y="675" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#405873" font-weight="500" text-anchor="start">10.0.6.0/24</text><rect x="871" y="637" width="155" height="29" rx="8" fill="#ffe9f0" stroke="none" stroke-width="0"/><text x="948.5" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#8e2454" font-weight="700" text-anchor="middle">DB-NACL</text><rect x="614" y="444" width="176" height="29" rx="8" fill="#dff0ff" stroke="none" stroke-width="0"/><text x="702.0" y="464" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#134e8a" font-weight="700" text-anchor="middle">ALB ENI • ALB-SG</text><rect x="614" y="568" width="182" height="29" rx="8" fill="#dff0ff" stroke="none" stroke-width="0"/><text x="705.0" y="588" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#134e8a" font-weight="700" text-anchor="middle">EC2 ENI • App-SG</text><rect x="614" y="692" width="172" height="29" rx="8" fill="#e9e4ff" stroke="none" stroke-width="0"/><text x="700.0" y="712" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#5d35a8" font-weight="700" text-anchor="middle">RDS ENI • DB-SG</text><line x1="685" y1="490" x2="685" y2="500" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><line x1="685" y1="614" x2="685" y2="624" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><line x1="534" y1="300" x2="534" y2="311" stroke="#2875c4" stroke-width="3"/><line x1="534" y1="311" x2="316" y2="311" stroke="#2875c4" stroke-width="3"/><line x1="316" y1="311" x2="316" y2="376" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><line x1="534" y1="311" x2="818" y2="311" stroke="#2875c4" stroke-width="3"/><line x1="818" y1="311" x2="818" y2="376" stroke="#2875c4" stroke-width="3" marker-end="url(#arrow)"/><line x1="316" y1="738" x2="818" y2="738" stroke="#6c51b6" stroke-width="3" stroke-dasharray="8 5"/><text x="568" y="756" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#67409b" font-weight="600" text-anchor="middle">DB failover / replication</text><rect x="58" y="844" width="1048" height="129" rx="12" fill="#ffffff" stroke="#d1e0ef" stroke-width="2"/><text x="80" y="873" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#164677" font-weight="800" text-anchor="start">THREE DISTINCT ENFORCEMENT BOUNDARIES</text><rect x="88" y="888" width="277" height="67" rx="9" fill="#edf5ff" stroke="#b9d7f5" stroke-width="2"/><text x="100" y="915" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#2376c6" font-weight="800" text-anchor="start">ALB-SG</text><text x="100" y="937" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#415976" font-weight="500" text-anchor="start">443 from approved clients</text><rect x="419" y="888" width="277" height="67" rx="9" fill="#edf5ff" stroke="#b9d7f5" stroke-width="2"/><text x="431" y="915" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#2376c6" font-weight="800" text-anchor="start">App-SG</text><text x="431" y="937" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#415976" font-weight="500" text-anchor="start">8080 only from ALB-SG</text><rect x="767" y="888" width="277" height="67" rx="9" fill="#edf5ff" stroke="#b9d7f5" stroke-width="2"/><text x="779" y="915" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#2376c6" font-weight="800" text-anchor="start">DB-SG</text><text x="779" y="937" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" fill="#415976" font-weight="500" text-anchor="start">3306 only from App-SG</text><rect x="1130" y="126" width="438" height="306" rx="15" fill="#fff" stroke="#bdd5eb" stroke-width="2"/><rect x="1130" y="126" width="438" height="54" rx="15" fill="#1360ac" stroke="none" stroke-width="0"/><text x="1150" y="162" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#fff" font-weight="800" text-anchor="start">SECURITY GROUPS</text><text x="1151" y="212" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Stateful resource/ENI protection</text><text x="1151" y="251" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Allow rules only; no explicit denies</text><text x="1151" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Return traffic automatically permitted</text><text x="1151" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Reference source security group IDs</text><text x="1151" y="368" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Evaluate the aggregate of all SG rules</text><rect x="1130" y="446" width="438" height="316" rx="15" fill="#fff" stroke="#dac9f3" stroke-width="2"/><rect x="1130" y="446" width="438" height="54" rx="15" fill="#6438a8" stroke="none" stroke-width="0"/><text x="1150" y="482" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#fff" font-weight="800" text-anchor="start">NETWORK ACLs</text><text x="1151" y="537" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Stateless controls at subnet boundary</text><text x="1151" y="577" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Allow and deny rules</text><text x="1151" y="617" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Lowest numbered matching rule wins</text><text x="1151" y="657" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Inbound + outbound return rules needed</text><text x="1151" y="697" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#1e3855" font-weight="500" text-anchor="start">• Rules use CIDRs, ports, protocols</text><rect x="1130" y="776" width="438" height="197" rx="15" fill="#fff6e8" stroke="#ebc688" stroke-width="2"/><text x="1150" y="811" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#915817" font-weight="800" text-anchor="start">TRAFFIC WALKTHROUGH</text><text x="1151" y="841" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#514128" font-weight="500" text-anchor="start">1  Client → ALB, HTTPS 443</text><text x="1151" y="866" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#514128" font-weight="500" text-anchor="start">2  ALB-SG → App-SG, TCP 8080</text><text x="1151" y="891" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#514128" font-weight="500" text-anchor="start">3  App-SG → DB-SG, TCP 3306</text><text x="1151" y="916" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#514128" font-weight="500" text-anchor="start">4  Stateful SG return is automatic</text><text x="1151" y="941" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#514128" font-weight="500" text-anchor="start">5  Stateless NACL return needs rules</text></svg>