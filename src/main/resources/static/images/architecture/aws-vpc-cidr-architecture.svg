<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1160" viewBox="0 0 1920 1160" role="img" aria-label="Amazon VPC IPv4 CIDR reference architecture with public, private application, and isolated database subnets across two Availability Zones">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7faff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#152d55" flood-opacity=".11"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2370bd" stroke-width="2"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#14223a}.heading{font-weight:700;font-size:37px}.sub{font-size:21px;fill:#52647d}.label{font-weight:700;font-size:20px}.body{font-size:17px}.small{font-size:15px;fill:#45607d}.pill{font-weight:700;font-size:17px}.link{stroke:#2370bd;stroke-width:4;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:10 8}.line{stroke:#2370bd;stroke-width:3;fill:none}.box{fill:white;stroke:#c4d6ef;stroke-width:2;rx:14;filter:url(#shadow)}</style></defs>
<rect width="1920" height="1160" fill="url(#bg)"/>
<text x="80" y="75" class="heading">Amazon VPC &amp; CIDR — Highly Available Three-Tier Network</text><text x="80" y="113" class="sub">Reference design  |  Region: us-east-1  |  VPC IPv4 CIDR: 10.20.0.0/16  |  Example address plan</text>
<rect x="70" y="150" width="1780" height="885" rx="25" fill="#fff" stroke="#97b8e5" stroke-width="3"/>
<rect x="95" y="175" width="1730" height="70" rx="14" fill="#e9f2ff"/><text x="120" y="220" font-size="25" font-weight="700" fill="#174b89">AWS Region: us-east-1</text><text x="1570" y="220" font-size="20" font-weight="700" fill="#174b89">VPC 10.20.0.0/16</text>
<rect x="120" y="286" width="440" height="85" rx="17" fill="#eef6ff" stroke="#92b9ed" stroke-width="2"/><text x="340" y="320" text-anchor="middle" class="label">Internet users</text><text x="340" y="347" text-anchor="middle" class="small">HTTPS → public Application Load Balancer</text>
<rect x="702" y="285" width="300" height="87" rx="17" fill="#edf9f5" stroke="#83bba6" stroke-width="2"/><text x="852" y="320" text-anchor="middle" class="label">Internet Gateway (IGW)</text><text x="852" y="347" text-anchor="middle" class="small">Attached to the VPC</text>
<rect x="1233" y="285" width="485" height="87" rx="17" fill="#fff6e8" stroke="#ddba71" stroke-width="2"/><text x="1475" y="320" text-anchor="middle" class="label">Public ALB (across 2 AZs)</text><text x="1475" y="347" text-anchor="middle" class="small">TLS 443 · routes traffic to private app targets</text>
<path d="M560 327 L700 327" class="link"/><path d="M1003 327 L1231 327" class="link"/>
<rect x="115" y="422" width="817" height="483" rx="20" fill="#f5faff" stroke="#a9c7eb" stroke-width="3"/><rect x="987" y="422" width="817" height="483" rx="20" fill="#f5faff" stroke="#a9c7eb" stroke-width="3"/>
<text x="149" y="465" font-size="24" font-weight="700" fill="#1a5088">Availability Zone us-east-1a</text><text x="1022" y="465" font-size="24" font-weight="700" fill="#1a5088">Availability Zone us-east-1b</text>
<!-- zone 1 -->
<rect x="148" y="497" width="752" height="105" rx="14" fill="#e4f5ee" stroke="#6caf95" stroke-width="2"/><text x="172" y="529" class="label">Public subnet A</text><text x="172" y="557" class="pill" fill="#126b4a">10.20.0.0/24</text><text x="172" y="584" class="small">NAT Gateway A · public route table → IGW</text><rect x="660" y="518" width="207" height="61" rx="11" fill="#fff" stroke="#7db79a"/><text x="763" y="554" text-anchor="middle" class="body">NAT Gateway A</text>
<rect x="148" y="627" width="752" height="104" rx="14" fill="#e8f0ff" stroke="#7aa5e9" stroke-width="2"/><text x="172" y="661" class="label">Private application subnet A</text><text x="172" y="690" class="pill">10.20.10.0/24</text><rect x="637" y="647" width="230" height="62" rx="12" fill="white" stroke="#90aee4"/><text x="752" y="682" text-anchor="middle" class="body">EC2 / ECS targets</text>
<rect x="148" y="757" width="752" height="105" rx="14" fill="#fff0ed" stroke="#dc9b91" stroke-width="2"/><text x="172" y="791" class="label">Isolated database subnet A</text><text x="172" y="820" class="pill">10.20.20.0/24</text><rect x="657" y="777" width="210" height="63" rx="12" fill="white" stroke="#dba49b"/><text x="762" y="812" text-anchor="middle" class="body">RDS subnet group</text>
<!-- zone 2 -->
<rect x="1020" y="497" width="752" height="105" rx="14" fill="#e4f5ee" stroke="#6caf95" stroke-width="2"/><text x="1044" y="529" class="label">Public subnet B</text><text x="1044" y="557" class="pill">10.20.1.0/24</text><text x="1044" y="584" class="small">NAT Gateway B · public route table → IGW</text><rect x="1532" y="518" width="207" height="61" rx="11" fill="#fff" stroke="#7db79a"/><text x="1635" y="554" text-anchor="middle" class="body">NAT Gateway B</text>
<rect x="1020" y="627" width="752" height="104" rx="14" fill="#e8f0ff" stroke="#7aa5e9" stroke-width="2"/><text x="1044" y="661" class="label">Private application subnet B</text><text x="1044" y="690" class="pill">10.20.11.0/24</text><rect x="1509" y="647" width="230" height="62" rx="12" fill="white" stroke="#90aee4"/><text x="1624" y="682" text-anchor="middle" class="body">EC2 / ECS targets</text>
<rect x="1020" y="757" width="752" height="105" rx="14" fill="#fff0ed" stroke="#dc9b91" stroke-width="2"/><text x="1044" y="791" class="label">Isolated database subnet B</text><text x="1044" y="820" class="pill">10.20.21.0/24</text><rect x="1529" y="777" width="210" height="63" rx="12" fill="white" stroke="#dba49b"/><text x="1634" y="812" text-anchor="middle" class="body">RDS standby / AZ</text>
<path d="M1475 373 V396 H755 V626" class="link"/><path d="M1475 396 V626" class="link"/><path d="M755 711 V756" class="link"/><path d="M1624 711 V756" class="link"/>
<rect x="142" y="932" width="1600" height="65" rx="12" fill="#f4f7fd" stroke="#c7d5ec"/><text x="165" y="960" class="body" font-weight="700">Subnet routing:</text><text x="340" y="960" class="body">Public: 0.0.0.0/0 → IGW   |   Private app: 0.0.0.0/0 → same-AZ NAT   |   Isolated DB: local routes only</text><text x="165" y="985" class="small">Security groups enforce tier-to-tier access; network ACLs provide subnet-level filtering. IPv4 /24 contains 256 addresses, with 251 AWS-usable.</text>
<text x="83" y="1085" class="label">CIDR cheat sheet:</text><text x="268" y="1085" class="body">/16 = 65,536 total IPv4 addresses   •   /24 = 256 total IPv4 addresses   •   AWS reserves 5 IPv4 addresses in every subnet</text><text x="84" y="1123" class="small">Illustrative design only · Confirm address plans, routes, service placement, resilience, and security controls before deployment.</text>
</svg>
