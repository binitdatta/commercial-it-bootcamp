<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">AWS Regions, Availability Zones and global edge network</title><desc id="desc">Conceptual infrastructure across US East, Europe and Asia Pacific. Three availability zones per region, global edge locations, user access and a private AWS backbone.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient><linearGradient id="region" x2="0" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#e7f1ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d3766" flood-opacity=".11"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#266bdc"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#152948}.main{font-size:30px;font-weight:800}.sub{font-size:16px;fill:#5a708e}.header{font-size:21px;font-weight:800;fill:#1051b5}.small{font-size:13px;fill:#55708f}.az{font-size:15px;font-weight:800;fill:#1450a4}.white{fill:#fff}.tag{font-size:15px;font-weight:700;fill:#fff}.legend{font-size:15px;fill:#293e5e}.connector{fill:none;stroke:#266bdc;stroke-width:3;stroke-linecap:round}.dash{stroke-dasharray:9 8}</style></defs>
<rect width="1500" height="760" rx="22" fill="url(#bg)"/>
<text x="47" y="56" class="main">AWS Global Infrastructure — Conceptual Reference Architecture</text>
<text x="47" y="84" class="sub">Three example Regions • multiple isolated Availability Zones per Region • global edge delivery and connectivity</text>
