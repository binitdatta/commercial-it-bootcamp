<!-- edge --> <rect x="40" y="325" width="165" height="130" rx="14" fill="#fff" stroke="#f5c38f" stroke-width="2" filter="url(#shadow)"/><circle cx="122" cy="367" r="28" fill="#f58b21"/><circle cx="122" cy="367" r="17" fill="none" stroke="#fff" stroke-width="2"/><path d="M95 367h54M122 340v54M108 346q27 20 0 42M136 346q-27 20 0 42" stroke="#fff" fill="none" stroke-width="2"/><text x="122" y="418" text-anchor="middle" font-size="17" font-weight="800">Edge Location</text><text x="122" y="440" text-anchor="middle" class="small">CloudFront cache</text>
<path d="M122 267v54" class="connector" marker-end="url(#arrow)"/>
