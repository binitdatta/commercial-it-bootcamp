<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Access denied', 'You do not have the required bootcamp role', ~{::main})}">
<main>
    <div class="row justify-content-center py-5">
        <div class="col-lg-7">
            <div class="soft-card p-5 text-center">
                <div class="display-5 fw-bold text-primary">403</div>
                <h1 class="h3">Access denied</h1>
                <p class="text-secondary">Your identity is authenticated, but the current realm roles do not authorize this page.</p>
                <a class="btn btn-primary" th:href="@{/}">Return home</a>
            </div>
        </div>
    </div>
</main>
</html>
