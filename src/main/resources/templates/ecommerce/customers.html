<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Customers', 'Ecommerce customers reference page', ~{::main})}">
<main>
    <div class="section-kicker">E-Commerce</div><h1 class="fw-bold mb-4">Customers</h1>
    <div class="soft-card overflow-hidden"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr></thead>
        <tbody><tr th:each="customer : ${customers}"><td th:text="${customer.id}">1</td><td class="fw-semibold" th:text="${customer.fullName}">Name</td><td th:text="${customer.email}">Email</td><td th:text="${customer.phone}">Phone</td></tr></tbody>
    </table></div></div>
</main>
</html>
