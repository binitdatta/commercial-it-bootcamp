<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('E-Commerce Reference', 'Spring Boot ecommerce capstone reference implementation', ~{::main})}">
<main>
    <div class="hero-panel p-4 p-lg-5 mb-4">
        <div class="section-kicker text-white opacity-75">Capstone reference implementation</div>
        <h1 class="fw-bold">Sample E-Commerce System</h1>
        <p class="lead mb-0">Use one understandable business domain to connect MVC, REST, service, repository, ORM, SQL, IAM and API security concepts.</p>
    </div>
    <div class="row g-4 mb-4">
        <div class="col-md-4"><div class="soft-card p-4"><div class="stat-number" th:text="${productCount}">12</div><div class="text-secondary">Products</div></div></div>
        <div class="col-md-4"><div class="soft-card p-4"><div class="stat-number" th:text="${customerCount}">4</div><div class="text-secondary">Customers</div></div></div>
        <div class="col-md-4"><div class="soft-card p-4"><div class="stat-number" th:text="${orderCount}">2</div><div class="text-secondary">Orders</div></div></div>
    </div>
    <div class="soft-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Featured seed products</h2><a th:href="@{/ecommerce/products}">View all</a></div>
        <div class="row g-3">
            <div class="col-md-6 col-xl-4" th:each="product : ${featuredProducts}">
                <a class="text-decoration-none" th:href="@{/ecommerce/products/{id}(id=${product.id})}">
                    <div class="border rounded-3 p-3 h-100 bg-light-subtle">
                        <div class="small text-primary fw-bold" th:text="${product.sku}">SKU</div>
                        <div class="fw-semibold text-dark" th:text="${product.name}">Product</div>
                        <div class="text-secondary" th:text="${'$' + product.price}">$0.00</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>
</html>
