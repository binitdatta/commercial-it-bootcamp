<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Order Detail', 'Ecommerce order detail reference page', ~{::main})}">
<main>
    <a class="small text-decoration-none" th:href="@{/ecommerce/orders}">← Back to orders</a>
    <div class="row g-4 mt-1">
        <div class="col-lg-8"><div class="soft-card p-4"><div class="section-kicker">Order</div><h1 class="h3 fw-bold" th:text="${order.orderNumber}">Order</h1><p class="text-secondary">Customer: <strong th:text="${order.customer.fullName}">Customer</strong></p>
            <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th class="text-end">Qty</th><th class="text-end">Unit</th><th class="text-end">Line Total</th></tr></thead><tbody>
                <tr th:each="item : ${order.items}"><td><div class="fw-semibold" th:text="${item.product.name}">Product</div><small class="text-secondary" th:text="${item.product.sku}">SKU</small></td><td class="text-end" th:text="${item.quantity}">1</td><td class="text-end" th:text="${'$' + item.unitPrice}">$0</td><td class="text-end" th:text="${'$' + item.lineTotal}">$0</td></tr>
            </tbody></table></div>
        </div></div>
        <div class="col-lg-4"><div class="soft-card p-4"><h2 class="h5 fw-bold">Order summary</h2><div class="d-flex justify-content-between"><span>Subtotal</span><strong th:text="${'$' + order.subtotal}">$0</strong></div><div class="d-flex justify-content-between"><span>Tax</span><strong th:text="${'$' + order.taxAmount}">$0</strong></div><div class="d-flex justify-content-between"><span>Shipping</span><strong th:text="${'$' + order.shippingAmount}">$0</strong></div><hr><div class="d-flex justify-content-between fs-5"><span>Total</span><strong class="text-primary" th:text="${'$' + order.totalAmount}">$0</strong></div><div class="mt-3"><span class="badge text-bg-primary" th:text="${order.status}">Status</span></div></div></div>
    </div>
</main>
</html>
