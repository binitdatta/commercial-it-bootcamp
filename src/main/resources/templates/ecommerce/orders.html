<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Orders', 'Ecommerce orders reference page', ~{::main})}">
<main>
    <div class="section-kicker">E-Commerce</div><h1 class="fw-bold mb-4">Orders</h1>
    <div class="soft-card overflow-hidden"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Order</th><th>Customer</th><th>Status</th><th>Placed</th><th class="text-end">Total</th></tr></thead>
        <tbody><tr th:each="order : ${orders}"><td><a th:href="@{/ecommerce/orders/{id}(id=${order.id})}" class="fw-semibold" th:text="${order.orderNumber}">Order</a></td><td th:text="${order.customer.fullName}">Customer</td><td><span class="badge text-bg-primary" th:text="${order.status}">Status</span></td><td th:text="${order.placedAt}">Date</td><td class="text-end fw-semibold" th:text="${'$' + order.totalAmount}">$0.00</td></tr></tbody>
    </table></div></div>
</main>
</html>
