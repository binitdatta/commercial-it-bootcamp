<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Products', 'Ecommerce product catalog', ~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-end mb-4"><div><div class="section-kicker">E-Commerce</div><h1 class="fw-bold mb-0">Products</h1></div><span class="badge text-bg-primary" th:text="${products.size() + ' active products'}">Products</span></div>
    <div class="soft-card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>SKU</th><th>Product</th><th>Category</th><th class="text-end">Price</th><th class="text-end">Stock</th></tr></thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td class="text-primary fw-semibold" th:text="${product.sku}">SKU</td>
                        <td><a th:href="@{/ecommerce/products/{id}(id=${product.id})}" th:text="${product.name}">Product</a></td>
                        <td th:text="${product.category.name}">Category</td>
                        <td class="text-end" th:text="${'$' + product.price}">$0.00</td>
                        <td class="text-end" th:text="${product.stockQuantity}">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</html>
