<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(${title}, 'Internship learning curriculum', ~{::section})}">
<body>
<section th:if="${section == 'tool-installation' and topic == 'jdk-21'}"
         th:replace="~{internships/jdk-21 :: lesson}"></section>
<section th:unless="${section == 'tool-installation' and topic == 'jdk-21'}" class="internship-page">
    <div class="container">
        <a th:href="@{/internships/{s}(s=${section})}" class="text-decoration-none">← <span th:text="${sectionTitle}">Module</span></a>
        <p class="eyebrow mt-4">Internship topic</p>
        <h1 class="fw-bold" th:text="${title}">Topic</h1>
        <div class="internship-panel mt-4">
            <h2 class="h5 fw-bold">Learning objectives and hands-on practice</h2>
            <p class="muted">This is a curriculum placeholder. Add topic-specific concepts, setup steps, examples, validation checks, and exercises here.</p>
        </div>
    </div>
</section>
</body>
</html>
