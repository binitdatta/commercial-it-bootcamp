<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout('Training', 'Commercial IT Bootcamp course catalog', ~{::main})}">
<main>
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-4">
        <div>
            <div class="section-kicker">Training catalog</div>
            <h1 class="fw-bold mb-1">Commercial IT Bootcamp</h1>
            <p class="text-secondary mb-0">Every lesson below maps to an individual Thymeleaf file and a future LMS video.</p>
        </div>
        <span class="badge text-bg-primary fs-6" th:text="${lessonCount + ' video-ready lessons'}">60 lessons</span>
    </div>

    <div class="row g-4">
        <div class="col-xl-6" th:each="section : ${sections}">
            <div class="soft-card h-100 p-4">
                <h2 class="h5 fw-bold text-primary" th:text="${section.title}">Section</h2>
                <div class="list-group list-group-flush mt-3">
                    <a class="list-group-item list-group-item-action border-0 px-0 d-flex gap-3 align-items-start"
                       th:each="lesson : ${section.lessons}" th:href="${lesson.path}">
                        <span class="lesson-number" th:text="${lesson.number}">1</span>
                        <span>
                            <span class="fw-semibold d-block" th:text="${lesson.title}">Lesson</span>
                            <small class="text-secondary" th:text="${lesson.objective}">Objective</small>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
